<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOM</title>

  <style>

    .cost-input {
      font-size: 15px;
      padding: 10px;
    }

    .calculate-button {
      background-color: green;
      color: white;
      border: none;
      font-size: 15px;
      padding: 12px 15px;
      cursor: pointer;
      
    }

    .error-message{
      color: red;
      font-family: arial;
      font-size: 20px;
    }


  </style>

</head>
<body>

  <p>Aamazon Shipping Calculator</p>

  <p>Orders under $40 = +$10 shipping.</p>

  <p>Orders over $40 = FREE shipping.</p>

  <input placeholder="Cost of Order" class="js-cost-input cost-input" onkeydown="handleCostKeydown(event)"/>

  <button onclick="calculateTotal()" class="js-calculate-button calculate-button"
  >Calculate</button>

  <p class="js-total-cost"></p>

  <p class="js-error-message error-message"></p>

  <Script>


    function calculateTotal() {

      const InputElement = document.querySelector('.js-cost-input')
      let cost = Number(InputElement.value);

      document.querySelector('.js-total-cost')
          .innerHTML = '';
        document.querySelector('.js-error-message')
          .innerHTML = '';

      if (cost <= 0) {
        document.querySelector('.js-error-message')
        .innerHTML = `Error: cost cannot be less than 0 and you entered: ${cost}`;
        return;
      }
  
      if (cost < 40) {
        cost = cost + 10;
      }

      document.querySelector('.js-total-cost')
        .innerHTML = `Total Cost: $${cost}`;
    
    };

    function handleCostKeydown(event) {
      if (event.key === 'Enter') {
        calculateTotal();
      }
    };


  </Script>
  
</body>
</html>
