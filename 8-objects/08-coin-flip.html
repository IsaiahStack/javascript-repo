<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>

  <p>Coin Flip Game</p>

  <button onclick="

    playGame('heads');

  ">Heads</button>

  <button onclick="

    playGame('tails');

  ">Tails</button>

  <script>

    const score = JSON.parse(localStorage.getItem('score')) || {
      wins: 0,
      losses: 0
    };

    function playGame(guess) {
      const rand = Math.random();
      let result = '';
      if (rand < 0.5) {
        result = 'heads';
      } else {
        result = 'tails';
      }

      if (guess === result) {
        score.wins++;
      } else {
        score.losses++;
      }

      localStorage.setItem('score',JSON.stringify(score));
      
      alert(`You picked ${guess} coin landed on ${result}
      Wins: ${score.wins} Losses: ${score.losses}`);

    };

    
  </script>
  
</body>
</html>
