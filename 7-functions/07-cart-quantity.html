<!DOCTYPE html>
<html>
  <head>
    <title>Cart Quantity</title>
  </head>

<body>

  <h3>Cart Quantity</h3>

  <button onclick="console.log(`Cart quantity: ${cartQuantity}`);">Show Quantity</button>

  <button onclick=" updateCartQuantity(1) ">Add 1 Item</button>

  <button onClick=" updateCartQuantity(2) ">Add 2 Items</button>

  <button onClick=" updateCartQuantity(3) ">Add 3 Items</button>

  <button onclick=" updateCartQuantity(-1) ">Remove 1 Item</button>

  <button onclick=" updateCartQuantity(-2) ">Remove 2 Items</button>

  <button onclick=" updateCartQuantity(-3) ">Remove 3 Items</button>

  <button onclick=" cartQuantity = 0; console.log('Cart was reset.'); console.log(`Cart quantity: ${cartQuantity}`)">Reset Cart</button>

    <script>

      let cartQuantity = 0;

      function updateCartQuantity(value) {

        if (cartQuantity + value > 100) {
          alert('Cart is full!');
          return;
        }

        if (cartQuantity + value < 0) {
          alert('Cart is empty!');
          return;
        }

        cartQuantity += value;
        console.log(`Cart quantity: ${cartQuantity}`);

      }

    </script>

  </body>
</html>
