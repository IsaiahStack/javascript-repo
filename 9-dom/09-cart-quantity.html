<!DOCTYPE html>
<html>
  <head>
    <title>Cart Quantity</title>
  </head>

<body>

  <h3>Cart Quantity</h3>

  <button onclick=" updateCartQuantity(1) ">Add to cart</button>

  <button onClick=" updateCartQuantity(2) ">+2</button>

  <button onClick=" updateCartQuantity(3) ">+3</button>

  <button onClick=" updateCartQuantity(4) ">+4</button>

  <button onClick=" updateCartQuantity(5) ">+5</button>

  <p></p>

  <button onclick=" updateCartQuantity(-1) ">Remove from cart</button>

  <button onclick=" updateCartQuantity(-2) ">-2</button>

  <button onclick=" updateCartQuantity(-3) ">-3</button>

  <p></p>

  <button onclick="

    document.querySelector('.js-quantity').innerHTML = `Cart quantity: ${cartQuantity}`
  
  ">Show Quantity</button>

  <button onclick=" 

    cartQuantity = 0;;
    localStorage.removeItem('cartQuantity');
    document.querySelector('.js-quantity').innerHTML = `Cart quantity: ${cartQuantity}`

  ">Reset Cart</button>

  <p class="js-quantity">Cart quantity: </p>

  <script>

    let cartQuantity = 0;

    let quantity = JSON.parse(localStorage.getItem('cartQuantity'))

    function updateCartQuantity(value) {

      if (cartQuantity + value > 100) {
        alert('Cart is full!');
        return;
      }

      if (cartQuantity + value < 0) {
        alert('Cart is empty!');
        return;
      }

      cartQuantity += value;
      console.log(`Cart quantity: ${cartQuantity}`);

      localStorage.setItem('cartQuantity', JSON.stringify(cartQuantity));

      document.querySelector('.js-quantity').innerHTML = `Cart quantity: ${cartQuantity}`

    }

  </script>

  </body>
</html>
